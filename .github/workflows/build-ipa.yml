
name: Build SHHQ Meta Pro IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s \
            /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Build CameraAccess for iPhone
        run: |
          set -o pipefail

          xcodebuild build \
            -project samples/CameraAccess/CameraAccess.xcodeproj \
            -scheme CameraAccess \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/MetaBuild" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee build.log

      - name: Test persistent media library
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x["name"].startswith("iPhone")))')
          xcodebuild test \
            -project samples/CameraAccess/CameraAccess.xcodeproj \
            -scheme CameraAccess \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/MetaTests" \
            -only-testing:CameraAccessTests/ProMediaLibraryTests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test.log

      - name: Package unsigned IPA
        run: |
          APP="$RUNNER_TEMP/MetaBuild/Build/Products/Release-iphoneos/CameraAccess.app"

          test -d "$APP"

          mkdir -p Payload
          cp -R "$APP" Payload/

          zip -qry SHHQ-Meta-Pro-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SHHQ-Meta-Pro-iPhone
          path: SHHQ-Meta-Pro-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MetaDAT-build-log
          path: |
            build.log
            test.log
          if-no-files-found: ignore
